 <ion-menu side="start" menuId="main-menu" contentId="main-content" [class.collapsed]="isCollapsed">
  <ion-content>
    <ion-list>
      <ion-item button>
        <ion-icon slot="start" name="home-outline"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-item>

      <ion-item button>
        <ion-icon slot="start" name="person-outline"></ion-icon>
        <ion-label>Profile</ion-label>
      </ion-item>

      <ion-item button>
        <ion-icon slot="start" name="settings-outline"></ion-icon>
        <ion-label>Settings</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>

  <ion-button (click)="toggleMenu()" expand="full" fill="clear">
    <ion-icon [name]="isCollapsed ? 'chevron-forward-outline' : 'chevron-back-outline'"></ion-icon>
  </ion-button>
</ion-menu>
