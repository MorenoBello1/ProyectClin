<!-- src/app/layouts/main-layout/main-layout.component.html -->
<ion-app>
  <ion-menu side="start" menuId="main-menu" contentId="main-content">
    <ion-content>
      <ion-list>
        <ion-item *ngFor="let item of menuItems" [routerLink]="item.url" routerDirection="root">
          <ion-icon slot="start" [name]="item.icono"></ion-icon>
          <ion-label>{{ item.titulo }}</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <div class="ion-page" id="main-content">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-buttons slot="start">
          <ion-menu-button menu="main-menu"></ion-menu-button>
        </ion-buttons>
        <ion-title>ProyectClin</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <router-outlet></router-outlet>
    </ion-content>
  </div>
</ion-app>
