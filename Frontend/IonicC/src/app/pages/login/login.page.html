<ion-content style="--background: url('/assets/fondologin.jpg') no-repeat center center / cover;">
  <div id="container">
    <ion-col>
      <ion-card class="glass-card">
        <br>
        <ion-row>
          <ion-col>

            <ion-icon size="large" name="log-in-outline" style="margin-top: 0.55rem; color: #ffffff;"></ion-icon>

              <ion-card-header>
                <ion-card-title class="titulo-robusto">Iniciar Sesión</ion-card-title>
                <div class="divider"></div>
              </ion-card-header>

            <ion-card-content>
              <ion-row style="text-align: start; max-width: 300px; margin: auto;">
                <ion-input label="Usuario"  [(ngModel)]="loginIniciar.usuario" labelPlacement="floating"></ion-input>
              </ion-row>
              <br>
              <ion-row style="text-align: start; max-width: 300px; margin: auto;">
                <ion-input type="password" [(ngModel)]="loginIniciar.contrasena" label="Contraseña" labelPlacement="floating"></ion-input>
              </ion-row>
              <br>
                <ion-button class="boton-login" shape="round" (click)="login()" style="min-width: 200px;"> entrar </ion-button> 
            </ion-card-content>

          </ion-col>
        </ion-row>
      </ion-card>
    </ion-col>
  </div>
</ion-content>
